<title>ANG Loots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap">

<style>
:root{
  --gold:#f5c118;
  --gold2:#ffd84d;
  --gold-dark:#b8860b;
  --bg-top:#1a0f00;
  --bg-mid:#2a1800;
  --bg-bot:#0f0900;
  --fg:#fff8e1;
  --muted:#c9a84c;
  --green:#00ff88;
  --font-d:'Bebas Neue','Arial Narrow',Arial,sans-serif;
  --font-b:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{
  background:radial-gradient(ellipse at 50% 0%,#3d2200 0%,#1a0f00 40%,#0a0600 100%);
  color:var(--fg);
  font-family:var(--font-b);
  min-height:100vh;
  position:relative;
}

/* CANVAS */
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.page-wrap{position:relative;z-index:1}

/* LIVE BADGE */
.live-bar{
  display:flex;justify-content:center;align-items:center;gap:8px;
  padding:12px 16px;
  font-family:var(--font-d);
  font-size:15px;letter-spacing:0.18em;
  color:var(--gold);
  text-shadow:0 0 12px var(--gold);
}
.live-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green),0 0 20px var(--green);
  animation:pdot 1.4s ease-in-out infinite;
}
@keyframes pdot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(0.7);opacity:0.5}}

/* HERO */
.hero{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:20px max(16px,env(safe-area-inset-left,0px)) 40px;
}

/* LOGO WRAPPER with rotating rectangle border */
.logo-outer{
  position:relative;
  width:180px;height:180px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:32px;
  flex-shrink:0;
}
/* spinning rectangle border */
.logo-outer::before{
  content:'';
  position:absolute;
  inset:-10px;
  border:3px solid transparent;
  border-radius:28px;
  background:
    linear-gradient(#0a0600,#0a0600) padding-box,
    conic-gradient(from 0deg,transparent 30%,var(--gold) 50%,var(--gold2) 60%,transparent 70%,transparent 100%) border-box;
  animation:spin-rect 2.5s linear infinite;
  border-radius:28px;
}
.logo-outer::after{
  content:'';
  position:absolute;
  inset:-14px;
  border:2px solid transparent;
  border-radius:32px;
  background:
    linear-gradient(#0a0600,#0a0600) padding-box,
    conic-gradient(from 180deg,transparent 30%,var(--gold-dark) 50%,var(--gold) 60%,transparent 70%,transparent 100%) border-box;
  animation:spin-rect 2.5s linear infinite reverse;
  opacity:0.7;
}
@keyframes spin-rect{to{transform:rotate(360deg)}}

.logo-box{
  width:160px;height:160px;
  border-radius:22px;
  overflow:hidden;
  border:3px solid var(--gold);
  box-shadow:
    0 0 0 4px rgba(245,193,24,0.15),
    0 0 30px rgba(245,193,24,0.5),
    0 0 60px rgba(245,193,24,0.2),
    inset 0 0 20px rgba(245,193,24,0.08);
  position:relative;z-index:1;
  animation:logo-pulse 2.5s ease-in-out infinite alternate;
}
@keyframes logo-pulse{
  from{box-shadow:0 0 0 4px rgba(245,193,24,.12),0 0 24px rgba(245,193,24,.4),0 0 48px rgba(245,193,24,.15)}
  to  {box-shadow:0 0 0 6px rgba(245,193,24,.2), 0 0 40px rgba(245,193,24,.7),0 0 80px rgba(245,193,24,.3)}
}
.logo-box img{width:100%;height:100%;object-fit:cover;display:block}

/* HEADINGS */
h1{
  font-family:var(--font-d);
  font-size:clamp(72px,22vw,120px);
  line-height:0.88;
  letter-spacing:0.05em;
  text-wrap:balance;
  margin-bottom:6px;
}
.t-white{
  display:block;
  color:#fff;
  text-shadow:0 0 30px rgba(255,255,255,0.3),0 2px 0 rgba(0,0,0,0.8);
}
.t-gold{
  display:block;
  background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 50%,var(--gold-dark) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(245,193,24,0.6));
}

/* TAGLINE */
.tagline{
  font-size:16px;font-weight:700;
  color:#fff;
  margin:16px 0 6px;
  line-height:1.5;
  max-width:320px;
  text-shadow:0 1px 4px rgba(0,0,0,0.8);
}
.sub-tags{
  font-size:13px;color:var(--muted);
  margin-bottom:32px;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
}
.sub-tags span{display:flex;align-items:center;gap:4px}

/* JOIN BUTTON */
.btn-join{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;max-width:360px;
  padding:20px 28px;
  border-radius:16px;
  border:none;cursor:pointer;
  font-family:var(--font-d);
  font-size:clamp(26px,7vw,34px);
  letter-spacing:0.12em;
  color:#1a0f00;
  background:linear-gradient(135deg,var(--gold2) 0%,var(--gold) 50%,#e8a800 100%);
  box-shadow:
    0 0 0 3px rgba(245,193,24,0.3),
    0 0 30px rgba(245,193,24,0.5),
    0 0 60px rgba(245,193,24,0.2),
    0 6px 24px rgba(0,0,0,0.5);
  animation:btn-glow 1.8s ease-in-out infinite alternate;
  text-decoration:none;
  position:relative;overflow:hidden;
  font-weight:900;
}
.btn-join::before{
  content:'';position:absolute;
  top:-50%;left:-60%;
  width:40%;height:200%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,0.35),transparent);
  animation:btn-shine 2.5s linear infinite;
}
@keyframes btn-shine{to{left:130%}}
@keyframes btn-glow{
  from{box-shadow:0 0 0 3px rgba(245,193,24,.25),0 0 24px rgba(245,193,24,.4),0 0 48px rgba(245,193,24,.15),0 6px 24px rgba(0,0,0,.5)}
  to  {box-shadow:0 0 0 5px rgba(245,193,24,.4), 0 0 50px rgba(245,193,24,.7),0 0 90px rgba(245,193,24,.35),0 6px 24px rgba(0,0,0,.5)}
}
.btn-join .icon{font-size:26px;flex-shrink:0}

/* COUNTDOWN */
.countdown-wrap{
  margin-top:20px;
  width:100%;max-width:360px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(245,193,24,0.2);
  border-radius:14px;
  padding:16px 20px;
  text-align:center;
}
.cd-label{
  font-family:var(--font-d);
  font-size:13px;letter-spacing:0.18em;
  color:var(--muted);
  margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.cd-display{
  display:flex;gap:8px;justify-content:center;
}
.cd-unit{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(245,193,24,0.25);
  border-radius:10px;
  padding:10px 14px;
  min-width:64px;
}
.cd-num{
  font-family:var(--font-d);
  font-size:clamp(32px,9vw,48px);
  line-height:1;
  color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,0.4);
}
.cd-sub{
  font-size:10px;letter-spacing:0.12em;
  color:var(--muted);text-transform:uppercase;
  margin-top:2px;
}

/* STATS */
.stats{
  display:flex;gap:12px;
  width:100%;max-width:360px;
  margin-top:16px;
}
.stat{
  flex:1;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(245,193,24,0.18);
  border-radius:12px;
  padding:14px 10px;
  text-align:center;
}
.stat-num{
  font-family:var(--font-d);
  font-size:clamp(22px,6vw,30px);
  color:var(--gold);
  line-height:1;
  text-shadow:0 0 14px rgba(245,193,24,0.4);
}
.stat-lbl{font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px}

/* BOTTOM CTA */
.bottom-cta{
  padding:30px max(16px,env(safe-area-inset-left,0px)) 40px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.bottom-note{font-size:12px;color:var(--muted);text-align:center;max-width:300px;line-height:1.5}
</style>

<script>
// ── AUTO REDIRECT ──
(function(){
  setTimeout(function(){
    window.location.href = 'https://t.me/+U6M34vrEXJc1YTM9';
  }, 3500);
})();

// ── COUNTDOWN ──
(function(){
  var KEY='ang_dl_v2';
  var end;
  try{ var s=localStorage.getItem(KEY); if(s) end=parseInt(s); }catch(e){}
  if(!end||end<Date.now()){ end=Date.now()+10*60*1000; try{localStorage.setItem(KEY,end);}catch(e){} }
  function tick(){
    var rem=Math.max(0,end-Date.now());
    var m=Math.floor(rem/60000), s=Math.floor((rem%60000)/1000);
    document.getElementById('cdM').textContent=String(m).padStart(2,'0');
    document.getElementById('cdS').textContent=String(s).padStart(2,'0');
    if(rem>0) setTimeout(tick,500);
  }
  tick();
})();

// ── MEMBER COUNTER ──
(function(){
  var base=4800+Math.floor(Math.random()*400), el=document.getElementById('mem');
  function fmt(n){ return n>=1000?(n/1000).toFixed(1)+'K':n; }
  el.textContent=fmt(base);
  setInterval(function(){ if(Math.random()<0.4){ base+=Math.floor(Math.random()*3)+1; el.textContent=fmt(base); } },3000);
})();

// ── CANVAS: spinning laser beams + glowing orbs ──
(function(){
  var cvs=document.getElementById('bg-canvas');
  var ctx=cvs.getContext('2d');
  var W,H;
  function resize(){ W=cvs.width=window.innerWidth; H=cvs.height=window.innerHeight; }
  resize();
  window.addEventListener('resize',resize);

  // LASER BEAMS — multiple long lines rotating from center/corners
  var beams=[];
  for(var i=0;i<12;i++){
    beams.push({
      cx: Math.random()*0.6+0.2,  // origin x (fraction of W)
      cy: Math.random()*0.4+0.1,  // origin y
      angle: Math.random()*Math.PI*2,
      speed: (Math.random()*0.003+0.002)*(Math.random()<0.5?1:-1),
      len: Math.random()*0.6+0.5, // fraction of screen height
      alpha: Math.random()*0.18+0.06,
      hue: Math.random()<0.7?45:220,
      width: Math.random()*2+1,
    });
  }

  // ORBS — slow drifting glowing circles
  var orbs=[];
  for(var j=0;j<60;j++){
    orbs.push({
      x:Math.random()*1,y:Math.random()*1,
      vx:(Math.random()-0.5)*0.0002,
      vy:(Math.random()-0.5)*0.0002,
      r:Math.random()*60+20,
      alpha:Math.random()*0.12+0.03,
      hue:Math.random()<0.8?45:25,
    });
  }

  // FALLING SPARKS
  var sparks=[];
  for(var k=0;k<40;k++){
    sparks.push(newSpark());
  }
  function newSpark(){
    return{
      x:Math.random(),y:Math.random()-0.1,
      vy:Math.random()*0.0008+0.0003,
      vx:(Math.random()-0.5)*0.0002,
      alpha:Math.random()*0.6+0.2,
      size:Math.random()*2+0.5,
      life:1,decay:Math.random()*0.003+0.001,
    };
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // Draw orbs
    orbs.forEach(function(o){
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-0.1)o.x=1.1; if(o.x>1.1)o.x=-0.1;
      if(o.y<-0.1)o.y=1.1; if(o.y>1.1)o.y=-0.1;
      var grd=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r);
      grd.addColorStop(0,'hsla('+o.hue+',90%,60%,'+o.alpha+')');
      grd.addColorStop(1,'hsla('+o.hue+',90%,40%,0)');
      ctx.beginPath();
      ctx.arc(o.x*W,o.y*H,o.r,0,Math.PI*2);
      ctx.fillStyle=grd;ctx.fill();
    });

    // Draw laser beams
    beams.forEach(function(b){
      b.angle+=b.speed;
      var cx=b.cx*W, cy=b.cy*H;
      var len=b.len*H;
      var ex=cx+Math.cos(b.angle)*len;
      var ey=cy+Math.sin(b.angle)*len;
      var grd=ctx.createLinearGradient(cx,cy,ex,ey);
      grd.addColorStop(0,'hsla('+b.hue+',95%,65%,0)');
      grd.addColorStop(0.3,'hsla('+b.hue+',95%,65%,'+b.alpha+')');
      grd.addColorStop(0.7,'hsla('+b.hue+',95%,65%,'+(b.alpha*0.6)+')');
      grd.addColorStop(1,'hsla('+b.hue+',95%,65%,0)');
      ctx.beginPath();
      ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);
      ctx.strokeStyle=grd;
      ctx.lineWidth=b.width;
      ctx.stroke();
    });

    // Draw sparks
    sparks.forEach(function(s,i){
      s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
      if(s.life<=0||s.y>1.1){ sparks[i]=newSpark(); return; }
      ctx.beginPath();
      ctx.arc(s.x*W,s.y*H,s.size,0,Math.PI*2);
      ctx.fillStyle='hsla(45,100%,75%,'+(s.alpha*s.life)+')';
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
